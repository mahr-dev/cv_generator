# Versión de Python: Vercel/uv leen esto; hay que quedar <3.14 hasta que
# pydantic-core y PyO3 publiquen ruedas para 3.14 (evita compilar Rust en el build).
[project]
name = "cv-generator"
version = "0.1.0"
requires-python = ">=3.12.0,<3.13.0"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.8.2",
  "pymongo==4.10.1",
  "python-docx==1.1.2",
  "reportlab==4.2.0",
  "python-dotenv==1.0.1",
]
